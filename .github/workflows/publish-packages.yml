name: Publish GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "data/**"
      - "index.html"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@beig-rules"
      - name: Publish npm package
        run: |
          set +e
          out=$(npm publish --access public 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "Published successfully"
            exit 0
          fi
          if echo "$out" | grep -qi "Cannot publish over existing version\|E409\|EPUBLISHCONFLICT"; then
            echo "Version already published — OK"
            exit 0
          fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
