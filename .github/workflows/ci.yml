name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f index.html
          test -f README.md
          test -f data/brands/catalog.v1.json
          test -f NetOpsToolbox.sln
          test -f src/NetOps.App/NetOps.App.csproj
          test -f src/NetOps.Core/NetOps.Core.csproj
          echo "Required paths OK"

      - name: Validate brand catalog JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/brands/catalog.v1.json").read_text(encoding="utf-8"))
          assert data.get("version") == 1
          brands = data.get("brands") or []
          models = data.get("models") or []
          ids = {b["id"] for b in brands}
          assert "huawei" in ids and "mikrotik" in ids
          for m in models:
              assert m["brand"] in ids
          print(f"OK brands={len(brands)} models={len(models)}")
          PY

      - name: HTML shell sanity
        run: |
          grep -q "NETOPS TOOLBOX" index.html
          grep -q "Firmware" index.html

  native-windows:
    name: Build Native Windows (WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NetOpsToolbox.sln

      - name: Build Release
        run: dotnet build NetOpsToolbox.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/NetOps.App/NetOps.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOpsToolbox-win-x64
          path: publish/win-x64
          if-no-files-found: error
