name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog, Core build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f index.html
          test -f data/brands/catalog.v1.json
          test -f data/firmware/catalog.v1.json
          test -f NetOpsToolbox.sln
          test -f src/NetOps.Core/Diagnosis/DiagnosisEngine.cs
          test -f src/NetOps.Core/Collectors/HostNetworkCollector.cs

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Core on Linux
        run: dotnet build src/NetOps.Core/NetOps.Core.csproj -c Release

      - name: Unit tests (Core)
        run: |
          dotnet test tests/NetOps.Core.Tests/NetOps.Core.Tests.csproj -c Release --no-build 2>/dev/null || \
          dotnet test tests/NetOps.Core.Tests/NetOps.Core.Tests.csproj -c Release

      - name: Validate brand catalog JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/brands/catalog.v1.json").read_text(encoding="utf-8"))
          ver = str(data.get("version", ""))
          assert ver.startswith("1"), ver
          ids = {b["id"] for b in data["brands"]}
          assert "huawei" in ids and "mikrotik" in ids
          print("catalog OK", ver, "brands", len(ids))
          fw = json.loads(Path("data/firmware/catalog.v1.json").read_text(encoding="utf-8"))
          assert str(fw.get("version", "")).startswith("1")
          assert len(fw.get("entries", [])) >= 5
          print("firmware OK", fw.get("version"), "entries", len(fw["entries"]))
          PY

  native-windows:
    name: Build Native Windows (WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NetOpsToolbox.sln

      - name: Build Release
        run: dotnet build NetOpsToolbox.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/NetOps.App/NetOps.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOpsToolbox-win-x64
          path: publish/win-x64
          if-no-files-found: error
